services:
  - type: web
    name: green-finance-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m green_model.web_app_phase2
    healthCheckPath: /health
    envVars:
      - key: PUBLIC_READONLY
        value: "1"
      - key: ADMIN_PASSWORD
        sync: false  # 密码在Render后台手动配置，不写入公开代码仓库
